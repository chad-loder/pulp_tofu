[build-system]
requires = [
    "setuptools >= 40.8.0",
    "wheel >= 0.29.0",
]
build-backend = 'setuptools.build_meta'

[project]
name = "pulp-tofu"
version = "0.0.0.dev"
description = "OpenTofu provider mirror plugin for the Pulp Project"
readme = "README.md"
authors = [
  {name="Chad Loder", email="26261238+chad-loder@users.noreply.github.com"},
]
classifiers = [
  "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
  "Operating System :: POSIX :: Linux",
  "Framework :: Django",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = [
  "pulpcore>=3.116.0,<3.130",
  "aiohttp>=3.10.10,<3.15",  # Same bounds as pulpcore 3.116.
  "Django>=5.2.0,<5.3",  # Same bounds as pulpcore 3.116.
  "djangorestframework>=3.14.0,<=3.17.1",  # Same bounds as pulpcore 3.116.
  "pysequoia>=0.1.33,<0.2",  # Same bounds as pulpcore 3.116.
  "yarl>=1.12.0,<1.25",  # Same bounds as pulpcore 3.116.
  "pyhaul>=1.0.0,<2",  # ETag and Content-Range parsing for resumed downloads.
]

[project.urls]
Repository = "https://github.com/chad-loder/pulp_tofu"
"Bug Tracker" = "https://github.com/chad-loder/pulp_tofu/issues"

[project.entry-points."pulpcore.plugin"]
pulp_tofu = "pulp_tofu:default_app_config"

[project.entry-points."pytest11"]
pulp_tofu = "pulp_tofu.pytest_plugin"

[dependency-groups]
# Local development only; Pulp's CI installs from the *_requirements.txt files.
lint = [
  "ruff==0.15.22",  # Inside plugin_template's >=0.15.11,<0.16.
  "mypy==2.4.0",
  "pyright==1.1.414",
  "django-stubs==5.2.9",  # Tracks Django 5.2.
  "djangorestframework-stubs==3.16.9",
]
test = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "aioresponses==0.7.9",
]

[tool.uv]
default-groups = ["lint", "test"]
exclude-newer = "168h"
# Local checks run against the pulpcore release the functional tests run on.
constraint-dependencies = ["pulpcore==3.116.1"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
local_partial_types = true
enable_error_code = [
  "possibly-undefined",
  "redundant-expr",
  "truthy-bool",
  "truthy-iterable",
  "ignore-without-code",
  "unused-awaitable",
  "explicit-override",
  "deprecated",
  "exhaustive-match",
]
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["^pulp_tofu/app/migrations/", "^docs/", "^\\.ci/"]

[tool.django-stubs]
django_settings_module = "pulp_dev_settings"

# pulpcore ships no py.typed; mypy reads its source so Django model fields resolve.
[[tool.mypy.overrides]]
module = ["pulpcore.*"]
follow_untyped_imports = true
implicit_reexport = true

# Modules that subclass pulpcore's unannotated models, serializers, viewsets and content
# handler: calls into pulpcore and the Any it returns stay unchecked here and nowhere else.
[[tool.mypy.overrides]]
module = [
  "pulp_tofu.app.downloaders",
  "pulp_tofu.app.mirror",
  "pulp_tofu.app.models",
  "pulp_tofu.app.registry",
  "pulp_tofu.app.serializers",
  "pulp_tofu.app.tasks.*",
  "pulp_tofu.app.viewsets",
]
disallow_untyped_calls = false
warn_return_any = false

# Test code drives untyped pulpcore fixtures and generated bindings.
[[tool.mypy.overrides]]
module = ["pulp_tofu.tests.functional.*"]
disallow_untyped_defs = false
disallow_any_generics = false

[tool.pytest.ini_options]
addopts = ["--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.setuptools.packages.find]
where = ["."]

[tool.towncrier]
filename = "CHANGES.md"
directory = "CHANGES/"
title_format = "## {version} ({project_date}) {{: #{version} }}"
template = "CHANGES/.TEMPLATE.md"
issue_format = "[#{issue}](https://github.com/chad-loder/pulp_tofu/issues/{issue})"
start_string = "[//]: # (towncrier release notes start)\n"
underlines = ["", "", ""]

    [[tool.towncrier.type]]
        directory = "feature"
        name = "Features"
        showcontent = true

    [[tool.towncrier.type]]
        directory = "bugfix"
        name = "Bugfixes"
        showcontent = true

    [[tool.towncrier.type]]
        directory = "doc"
        name = "Improved Documentation"
        showcontent = true

    [[tool.towncrier.type]]
        directory = "removal"
        name = "Removals"
        showcontent = true

    [[tool.towncrier.type]]
        directory = "deprecation"
        name = "Deprecations"
        showcontent = true

    [[tool.towncrier.type]]
        directory = "misc"
        name = "Misc"
        showcontent = false


[tool.check-manifest]
ignore = [
    ".git-blame-ignore-revs",
    "AGENTS.md",
    "CHANGES/**",
    "CLAUDE.md",
    "doc_requirements.txt",
    "lint_requirements.txt",
    "docs/**",
    "template_config.yml",
    ".coveragerc",
    ".dependabot/config.yml",
    ".ci/**",
    ".github/**",
    ".gitleaks.toml",
]

[tool.bumpversion]
# This section is managed by the plugin template. Do not edit manually.

current_version = "0.0.0.dev"
commit = false
tag = false
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<alpha>0a)?(?P<patch>\\d+)(\\.(?P<release>[a-z]+))?"
serialize = [
  "{major}.{minor}.{patch}.{release}",
  "{major}.{minor}.{patch}",
  "{major}.{minor}.{alpha}{patch}.{release}",
  "{major}.{minor}.{alpha}{patch}",
]

[tool.bumpversion.parts.alpha]
# This section is managed by the plugin template. Do not edit manually.

# This is sort of a hack. In PEP440 prerelease markers work quite differently.
# But this fits best with the way we have been doing release versions.
optional_value = "final"
values = [
  "0a",
  "final",
]
independent = true

[tool.bumpversion.parts.release]
# This section is managed by the plugin template. Do not edit manually.

optional_value = "prod"
values = [
  "dev",
  "prod",
]

[[tool.bumpversion.files]]
# This section is managed by the plugin template. Do not edit manually.

filename = "./pulp_tofu/app/__init__.py"
search = "version = \"{current_version}\""
replace = "version = \"{new_version}\""

[[tool.bumpversion.files]]
# This section is managed by the plugin template. Do not edit manually.

filename = "./pyproject.toml"
search = "version = \"{current_version}\""
replace = "version = \"{new_version}\""


[tool.ruff]
# This section is managed by the plugin template. Do not edit manually.
line-length = 100
extend-exclude = [
  "docs/**",
  "**/migrations/*.py",
]

[tool.ruff.lint]
# This section is managed by the plugin template. Do not edit manually.
select = ["E4", "E7", "E9", "F"]
extend-select = [
  "I",
  "INT",
  "TID",
  "T10",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# This section is managed by the plugin template. Do not edit manually.
"distutils".msg = "The 'distutils' module has been deprecated since Python 3.9."
"pulpcore.app.settings".msg = "Always import 'settings' from 'django.conf' instead."
"pulpcore.app".msg = "The 'pulpcore' apis must only be consumed via 'pulpcore.plugin'."

[tool.ruff.lint.isort]
# This section is managed by the plugin template. Do not edit manually.
sections = { second-party = ["pulpcore"] }
section-order = ["future", "standard-library", "third-party", "second-party", "first-party", "local-folder"]
