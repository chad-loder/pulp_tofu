location /pulp/tofu/ {
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $http_host;
    # we don't want nginx trying to do something clever with
    # redirects, we set the Host: header above already.
    proxy_redirect off;
    proxy_pass http://pulp-content;
    # Archives stream to the client while Pulp downloads them.
    proxy_buffering off;
    # HTTP/1.1 makes the content app send chunked bodies, so a stream Pulp aborts
    # reaches the client without its final chunk. Over HTTP/1.0 the body ends at
    # connection close and an aborted archive looks complete.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
}

# The provider registry, when TOFU_REGISTRY_ENABLED. An exact match, so it wins over the
# image's ACME /.well-known/ block. The /tofu/ path is TOFU_REGISTRY_PATH_PREFIX.
location = /.well-known/terraform.json {
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $http_host;
    proxy_redirect off;
    proxy_pass http://pulp-api;
}

location /tofu/ {
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $http_host;
    proxy_redirect off;
    proxy_pass http://pulp-api;
}
