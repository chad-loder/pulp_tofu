---
name: "Tofu Publish Release"
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

env:
  UV_SYSTEM_PYTHON: "1"

defaults:
  run:
    working-directory: "pulp_tofu"

jobs:
  build:
    uses: "./.github/workflows/build.yml"

  create-gh-release:
    runs-on: "ubuntu-latest"
    needs:
      - "build"

    permissions:
      contents: "write"

    env:
      TAG_NAME: "${{ github.ref_name }}"

    steps:
      - uses: "actions/checkout@v6"
        with:
          fetch-depth: 0
          path: "pulp_tofu"

      - uses: "actions/setup-python@v6"
        with:
          python-version: "3.11"
      - name: "Install uv"
        uses: "astral-sh/setup-uv@v7"
        with:
          enable-cache: true

      - name: "Install towncrier"
        run: |
          uv pip install towncrier

      - name: "Get release notes"
        id: "get_release_notes"
        shell: "bash"
        run: |
          # The last commit before the release commit contains the release CHANGES fragments
          git checkout "${TAG_NAME}~"
          NOTES=$(towncrier build --draft --version $TAG_NAME | .ci/scripts/clean_gh_release_notes.py pulp_tofu $TAG_NAME)
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: "Create release on GitHub"
        uses: "actions/github-script@v8"
        env:
          RELEASE_BODY: "${{ steps.get_release_notes.outputs.body }}"
        with:
          script: |
            const { TAG_NAME, RELEASE_BODY } = process.env;

            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: TAG_NAME,
              body: RELEASE_BODY,
              make_latest: "legacy",
            });
...
