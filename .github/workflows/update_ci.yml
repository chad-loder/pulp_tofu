---
name: "Tofu CI Update"
on:
  workflow_dispatch:

env:
  UV_SYSTEM_PYTHON: "1"

jobs:
  update:
    runs-on: "ubuntu-latest"

    strategy:
      fail-fast: false

    steps:
      - uses: "actions/checkout@v6"
        with:
          fetch-depth: 0
          repository: "pulp/plugin_template"
          path: "plugin_template"

      - uses: "actions/setup-python@v6"
        with:
          python-version: "3.11"
      - name: "Install uv"
        uses: "astral-sh/setup-uv@v7"
        with:
          enable-cache: true

      - name: "Install python dependencies"
        run: |
          uv pip install gitpython packaging -r plugin_template/requirements.txt

      - name: "Configure Git with chad-loder name and email"
        run: |
          git config --global user.name 'chad-loder'
          git config --global user.email '26261238+chad-loder@users.noreply.github.com'
      - uses: "actions/checkout@v6"
        with:
          fetch-depth: 0
          path: "pulp_tofu"
          ref: "main"

      - name: "Run update"
        working-directory: "pulp_tofu"
        run: |
          ../plugin_template/scripts/update_ci.sh

      - name: "Create Pull Request for CI files"
        uses: "peter-evans/create-pull-request@v8"
        id: "create_pr_main"
        with:
          token: "${{ secrets.RELEASE_TOKEN }}"
          path: "pulp_tofu"
          committer: "chad-loder <26261238+chad-loder@users.noreply.github.com>"
          author: "chad-loder <26261238+chad-loder@users.noreply.github.com>"
          title: "Update CI files for branch main"
          branch: "update-ci/main"
          base: "main"
          delete-branch: true
      - name: "Mark PR automerge"
        working-directory: "pulp_tofu"
        run: |
          gh pr merge --rebase --auto "${{ steps.create_pr_main.outputs.pull-request-number }}"
        if: "steps.create_pr_main.outputs.pull-request-number"
        env:
          GH_TOKEN: "${{ secrets.RELEASE_TOKEN }}"
        continue-on-error: true
...
