---
name: "Tofu Update Labels"
on:
  push:
    branches:
      - "main"
    paths:
      - "template_config.yml"

env:
  UV_SYSTEM_PYTHON: "1"

jobs:
  update_backport_labels:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/setup-python@v6"
        with:
          python-version: "3.12"
      - name: "Install uv"
        uses: "astral-sh/setup-uv@v7"
        with:
          enable-cache: true
      - name: "Configure Git with chad-loder name and email"
        run: |
          git config --global user.name 'chad-loder'
          git config --global user.email '26261238+chad-loder@users.noreply.github.com'
      - uses: "actions/checkout@v6"
      - name: "Update labels"
        run: |
          uv run --script .github/workflows/scripts/update_backport_labels.py
        env:
          GITHUB_TOKEN: "${{ secrets.RELEASE_TOKEN }}"
...
