---
# The documentation site on GitHub Pages, built with pulp-docs from docs/ and
# .github/pages/. Not generated by plugin_template.
name: "Pages"

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - ".github/pages/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  # pulp-docs main at 2026-10-16.
  PULP_DOCS_REF: "22a82dad2765d66701a964bb81a86fc2ced2cd09"

jobs:
  # Runs the docs toolchain with a read-only token.
  build:
    runs-on: "ubuntu-latest"
    permissions:
      contents: "read"
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          path: "pulp_tofu"
          # pulp-docs reads each component's git history for edit links and dates.
          fetch-depth: 0
          persist-credentials: false
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          repository: "pulp/pulp-docs"
          ref: "${{ env.PULP_DOCS_REF }}"
          path: "pulp-docs"
          persist-credentials: false
      - uses: "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0" # v7.1.0
        with:
          python-version: "3.12"
      - name: "Install pulp-docs"
        run: "python -m pip install ./pulp-docs"
      - name: "Stage the site root"
        run: |
          mkdir pages-root
          cp -R pulp-docs/pulpproject.org/assets pulp-docs/pulpproject.org/css \
            pulp-docs/pulpproject.org/js pages-root/
          cp -R pulp_tofu/.github/pages/root/. pages-root/
      - name: "Build"
        working-directory: "pulp-docs"
        run: |
          pulp-docs build --strict -f ../pulp_tofu/.github/pages/mkdocs.yml \
            --path "pulp_tofu@.." --draft --no-blog
      - uses: "actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9" # v5.0.0
        with:
          path: "site"

  # Holds the Pages token; runs only the deploy action.
  deploy:
    needs: "build"
    runs-on: "ubuntu-latest"
    permissions:
      pages: "write"
      id-token: "write"
    environment:
      name: "github-pages"
      url: "${{ steps.deployment.outputs.page_url }}"
    steps:
      - id: "deployment"
        uses: "actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346" # v5.0.1
